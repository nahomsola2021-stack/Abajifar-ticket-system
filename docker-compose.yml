# Local development stack.
#
#   docker compose up --build
#
# The API is on http://localhost:8000 and the web app on
# http://localhost:5173. The API reads its own settings from
# backend/.env, so copy backend/.env.example to backend/.env first.
#
# The frontend needs the Supabase settings and the API URL. They are passed
# through from the shell or from a .env file next to this one:
#
#   VITE_SUPABASE_URL=https://your-project-ref.supabase.co
#   VITE_SUPABASE_ANON_KEY=your_supabase_anon_key

services:
  api:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - api_documents:/var/data/documents
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  web:
    image: node:22-alpine
    working_dir: /app
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  api_documents:
  web_node_modules:
